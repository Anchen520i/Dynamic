<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="785" viewBox="0 0 1100 785" role="img" aria-label="Mystic Surge routing illustration"><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68e4db"/><stop offset="1" stop-color="#8c9eff"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192a43"/><stop offset="1" stop-color="#111c30"/></linearGradient></defs><style><![CDATA[
  .bg{fill:#0b1221}.panel{fill:#131e31;stroke:#2b3d58;stroke-width:1.5}.muted{fill:#95a7c2}.white{fill:#eef5ff}.cyan{fill:#6ed9f7}.mint{fill:#65e7c2}.purple{fill:#b7a1ff}.gold{fill:#f6c980}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans CJK SC",sans-serif}
  .heading{font-size:27px;font-weight:750;letter-spacing:1px}.label{font-size:20px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px;letter-spacing:1.4px}
  .route{fill:none;stroke:#4c6b94;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .flow{fill:none;stroke:#71d9f8;stroke-width:3;stroke-dasharray:9 15;stroke-linecap:round;animation:travel 2.6s linear infinite}
  .glow{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .spark{animation:pulse 2.3s ease-in-out infinite}
  @keyframes travel{to{stroke-dashoffset:-96}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.flow,.glow,.spark{animation:none}}
]]></style><rect width="100%" height="100%" rx="24" class="bg"/><text x="45" y="55" class="mint tiny">MYSTIC  /  RULE PRIORITY</text><text x="45" y="98" class="white heading">精确规则优先</text><text x="45" y="128" class="muted small">自上而下匹配 · 命中即采用对应策略</text><path d="M79 248 V275" class="route"/><path d="M79 248 V275" class="flow"/><rect x="46" y="163" width="1008" height="86" rx="16" class="panel"/><circle cx="79" cy="205" r="22" fill="#253b55" stroke="#f6a2a2" stroke-width="2"/><text x="79" y="211" text-anchor="middle" class="white small">01</text><text x="124" y="197" class="white label">自定义拒绝</text><text x="124" y="225" class="muted small">DOMAIN,msmp.abchina.com.cn,REJECT</text><path d="M79 360 V387" class="route"/><path d="M79 360 V387" class="flow"/><rect x="46" y="275" width="1008" height="86" rx="16" class="panel"/><circle cx="79" cy="317" r="22" fill="#253b55" stroke="#b7a1ff" stroke-width="2"/><text x="79" y="323" text-anchor="middle" class="white small">02</text><text x="124" y="309" class="white label">Apple 与应用专属规则</text><text x="124" y="337" class="muted small">Apple → DIRECT · Ai / 视频 / 社交 → 独立策略</text><path d="M79 472 V499" class="route"/><path d="M79 472 V499" class="flow"/><rect x="46" y="387" width="1008" height="86" rx="16" class="panel"/><circle cx="79" cy="429" r="22" fill="#253b55" stroke="#65e7c2" stroke-width="2"/><text x="79" y="435" text-anchor="middle" class="white small">03</text><text x="124" y="421" class="white label">国内与本地网络</text><text x="124" y="449" class="muted small">China → DIRECT · LAN → DIRECT · SYSTEM → DIRECT</text><path d="M79 584 V611" class="route"/><path d="M79 584 V611" class="flow"/><rect x="46" y="499" width="1008" height="86" rx="16" class="panel"/><circle cx="79" cy="541" r="22" fill="#253b55" stroke="#65e7c2" stroke-width="2"/><text x="79" y="547" text-anchor="middle" class="white small">04</text><text x="124" y="533" class="white label">中国 IP</text><text x="124" y="561" class="muted small">GEOIP,CN,DIRECT</text><rect x="46" y="611" width="1008" height="86" rx="16" class="panel"/><circle cx="79" cy="653" r="22" fill="#253b55" stroke="#6ed9f7" stroke-width="2"/><text x="79" y="659" text-anchor="middle" class="white small">05</text><text x="124" y="645" class="white label">最终兜底</text><text x="124" y="673" class="muted small">FINAL,Proxy,dns-failed</text><text x="48" y="755" class="muted small">规则集按主配置当前顺序展示。实际命中结果取决于请求属性与运行时环境。</text></svg>