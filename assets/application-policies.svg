<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="Mystic Surge routing illustration"><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68e4db"/><stop offset="1" stop-color="#8c9eff"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192a43"/><stop offset="1" stop-color="#111c30"/></linearGradient></defs><style><![CDATA[
  .bg{fill:#0b1221}.panel{fill:#131e31;stroke:#2b3d58;stroke-width:1.5}.muted{fill:#95a7c2}.white{fill:#eef5ff}.cyan{fill:#6ed9f7}.mint{fill:#65e7c2}.purple{fill:#b7a1ff}.gold{fill:#f6c980}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans CJK SC",sans-serif}
  .heading{font-size:27px;font-weight:750;letter-spacing:1px}.label{font-size:20px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px;letter-spacing:1.4px}
  .route{fill:none;stroke:#4c6b94;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .flow{fill:none;stroke:#71d9f8;stroke-width:3;stroke-dasharray:9 15;stroke-linecap:round;animation:travel 2.6s linear infinite}
  .glow{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .spark{animation:pulse 2.3s ease-in-out infinite}
  @keyframes travel{to{stroke-dashoffset:-96}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.flow,.glow,.spark{animation:none}}
]]></style><rect width="100%" height="100%" rx="24" class="bg"/><text x="46" y="55" class="purple tiny">MYSTIC  /  APPLICATION POLICIES</text><text x="46" y="99" class="white heading">应用级独立出口</text><text x="46" y="131" class="muted small">一个默认策略，多个专属出口 · 自由选择 Proxy 或地区</text><rect x="47" y="167" width="1006" height="82" rx="15" class="panel"/><rect x="65" y="184" width="6" height="48" rx="3" fill="#b7a1ff"/><text x="90" y="198" class="muted tiny">AI</text><text x="90" y="225" class="white label">Ai</text><text x="550" y="212" class="cyan small">Proxy / JP / TW / US / HK / SG</text><circle cx="1020" cy="208" r="5" fill="#b7a1ff" class="glow"/><rect x="47" y="265" width="1006" height="82" rx="15" class="panel"/><rect x="65" y="282" width="6" height="48" rx="3" fill="#6ed9f7"/><text x="90" y="296" class="muted tiny">VIDEO</text><text x="90" y="323" class="white label">Disney · Netflix · YouTube</text><text x="550" y="310" class="cyan small">Proxy / JP / TW / US / HK / SG</text><circle cx="1020" cy="306" r="5" fill="#6ed9f7" class="glow"/><rect x="47" y="363" width="1006" height="82" rx="15" class="panel"/><rect x="65" y="380" width="6" height="48" rx="3" fill="#f6c980"/><text x="90" y="394" class="muted tiny">SOCIAL</text><text x="90" y="421" class="white label">Telegram · TikTok · Twitter</text><text x="550" y="408" class="cyan small">Proxy / JP / TW / US / HK / SG</text><circle cx="1020" cy="404" r="5" fill="#f6c980" class="glow"/><rect x="47" y="461" width="1006" height="82" rx="15" class="panel"/><rect x="65" y="478" width="6" height="48" rx="3" fill="#65e7c2"/><text x="90" y="492" class="muted tiny">MUSIC</text><text x="90" y="519" class="white label">Spotify</text><text x="550" y="506" class="cyan small">Proxy / JP / TW / US / HK / SG</text><circle cx="1020" cy="502" r="5" fill="#65e7c2" class="glow"/><rect x="47" y="559" width="1006" height="82" rx="15" class="panel"/><rect x="65" y="576" width="6" height="48" rx="3" fill="#65e7c2"/><text x="90" y="590" class="muted tiny">LOCAL</text><text x="90" y="617" class="white label">Bilibili</text><text x="550" y="604" class="cyan small">DIRECT / Taiwan</text><circle cx="1020" cy="600" r="5" fill="#65e7c2" class="glow"/><rect x="47" y="675" width="1006" height="66" rx="15" fill="#202747" stroke="#4b4b83"/><text x="70" y="702" class="white label">DEFAULT · Proxy</text><text x="70" y="727" class="muted small">Mystic 节点池 / 五个 Smart 地区组 · 未命中规则的默认代理出口</text></svg>