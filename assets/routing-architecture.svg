<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-label="Mystic Surge routing illustration"><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68e4db"/><stop offset="1" stop-color="#8c9eff"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192a43"/><stop offset="1" stop-color="#111c30"/></linearGradient></defs><style><![CDATA[
  .bg{fill:#0b1221}.panel{fill:#131e31;stroke:#2b3d58;stroke-width:1.5}.muted{fill:#95a7c2}.white{fill:#eef5ff}.cyan{fill:#6ed9f7}.mint{fill:#65e7c2}.purple{fill:#b7a1ff}.gold{fill:#f6c980}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans CJK SC",sans-serif}
  .heading{font-size:27px;font-weight:750;letter-spacing:1px}.label{font-size:20px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px;letter-spacing:1.4px}
  .route{fill:none;stroke:#4c6b94;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .flow{fill:none;stroke:#71d9f8;stroke-width:3;stroke-dasharray:9 15;stroke-linecap:round;animation:travel 2.6s linear infinite}
  .glow{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .spark{animation:pulse 2.3s ease-in-out infinite}
  @keyframes travel{to{stroke-dashoffset:-96}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.flow,.glow,.spark{animation:none}}
]]></style><rect width="100%" height="100%" rx="24" class="bg"/><text x="46" y="57" class="cyan tiny">MYSTIC  /  SYSTEM MAP</text><text x="46" y="100" class="white heading">智能分流架构</text><text x="46" y="131" class="muted small">从规则命中到策略选择 · 结构示意</text><rect x="380" y="164" width="340" height="82" rx="16" fill="url(#card)" stroke="#344968" stroke-width="1.5"/><rect x="397" y="183" width="5" height="44" rx="3" fill="#6ed9f7"/><text x="416" y="200" class="white label">SURGE ENGINE</text><text x="416" y="225" class="muted small">顺序匹配 · 首个适用规则</text><path d="M550 246 V282 H257 V314 M550 282 H843 V314" class="route"/><path d="M550 246 V282 H257 V314 M550 282 H843 V314" class="flow"/><rect x="82" y="314" width="350" height="86" rx="16" fill="url(#card)" stroke="#344968" stroke-width="1.5"/><rect x="99" y="333" width="5" height="48" rx="3" fill="#65e7c2"/><text x="118" y="350" class="white label">DIRECT / REJECT</text><text x="118" y="375" class="muted small">Apple · China · LAN · SYSTEM</text><rect x="668" y="314" width="350" height="86" rx="16" fill="url(#card)" stroke="#344968" stroke-width="1.5"/><rect x="685" y="333" width="5" height="48" rx="3" fill="#b7a1ff"/><text x="704" y="350" class="white label">SERVICE ROUTING</text><text x="704" y="375" class="muted small">Ai · Streaming · Social</text><path d="M843 400 V438 H550 V466" class="route"/><path d="M843 400 V438 H550 V466" class="flow"/><rect x="380" y="466" width="340" height="84" rx="16" fill="url(#card)" stroke="#344968" stroke-width="1.5"/><rect x="397" y="485" width="5" height="46" rx="3" fill="#b7a1ff"/><text x="416" y="502" class="white label">POLICY SELECTION</text><text x="416" y="527" class="muted small">应用策略组 → Proxy / 地区</text><path d="M550 550 V592" class="route"/><path d="M550 550 V592" class="flow"/><rect x="82" y="592" width="936" height="128" rx="18" fill="#15243b" stroke="#3c5175"/><text x="110" y="624" class="cyan tiny">SMART REGIONS  /  MYSTIC NODE POOL</text><rect x="111" y="641" width="157" height="56" rx="12" fill="#243754" stroke="#40597d"/><circle cx="130" cy="669" r="5" fill="#65e7c2" class="glow"/><text x="145" y="675" class="white small">JP · Japan</text><rect x="293" y="641" width="157" height="56" rx="12" fill="#243754" stroke="#40597d"/><circle cx="312" cy="669" r="5" fill="#65e7c2" class="glow"/><text x="327" y="675" class="white small">TW · Taiwan</text><rect x="475" y="641" width="157" height="56" rx="12" fill="#243754" stroke="#40597d"/><circle cx="494" cy="669" r="5" fill="#65e7c2" class="glow"/><text x="509" y="675" class="white small">US · America</text><rect x="657" y="641" width="157" height="56" rx="12" fill="#243754" stroke="#40597d"/><circle cx="676" cy="669" r="5" fill="#65e7c2" class="glow"/><text x="691" y="675" class="white small">HK · HongKong</text><rect x="839" y="641" width="157" height="56" rx="12" fill="#243754" stroke="#40597d"/><circle cx="858" cy="669" r="5" fill="#65e7c2" class="glow"/><text x="873" y="675" class="white small">SG · Singapore</text><text x="84" y="755" class="muted small">注：仅表示逻辑分流路径，非 Surge 引擎的完整内部执行顺序。</text></svg>