<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="RESOURCE ECOSYSTEM">
<title>RESOURCE ECOSYSTEM</title><desc>Six components, one coherent Surge toolkit</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1327"/><stop offset="1" stop-color="#131D38"/></linearGradient>
 <linearGradient id="wire"><stop stop-color="#4FA9FF"/><stop offset=".5" stop-color="#A88BFF"/><stop offset="1" stop-color="#3DE0C0"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
 .edge{fill:none;stroke:url(#wire);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 10;animation:travel 3.2s linear infinite}
 .halo{opacity:.38;animation:breathe 3s ease-in-out infinite}
 .card{fill:#182641;stroke:#40557A;stroke-width:1}
 .name{fill:#F4F7FF;font-size:16px;font-weight:700}
 .sub{fill:#9DB2D2;font-size:11px}
 .dot{animation:breathe 2.5s ease-in-out infinite}
 @keyframes travel{to{stroke-dashoffset:-60}}
 @keyframes breathe{0%,100%{opacity:.25}50%{opacity:.9}}
 @media (prefers-reduced-motion:reduce){.edge,.halo,.dot{animation:none}}
</style>
<rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
<text x="34" y="43" fill="#A6BADE" font-size="12" letter-spacing="3">RESOURCE ECOSYSTEM</text>
<text x="34" y="68" fill="#7189B0" font-size="12">Six components, one coherent Surge toolkit</text>
<path class="edge" d="M204 147 L224 147"/>
<path class="edge" d="M394 147 L414 147"/>
<path class="edge" d="M584 147 L604 147"/>
<path class="edge" d="M774 147 L794 147"/>
<path class="edge" d="M860 180 L860 226"/>
<path class="edge" d="M860 226 L480 226"/>
<path class="edge" d="M480 226 L480 253"/>
<rect class="halo" x="32" y="112" width="174" height="70" rx="15" fill="none" stroke="#4FA9FF" stroke-width="3" filter="url(#glow)"/>
<rect class="card" x="34" y="114" width="170" height="66" rx="13"/>
<circle class="dot" cx="53" cy="137" r="5" fill="#4FA9FF"/>
<text class="name" x="66" y="143">CORE</text>
<text class="sub" x="52" y="165">iOS · macOS</text>
<rect class="halo" x="222" y="112" width="174" height="70" rx="15" fill="none" stroke="#A88BFF" stroke-width="3" filter="url(#glow)"/>
<rect class="card" x="224" y="114" width="170" height="66" rx="13"/>
<circle class="dot" cx="243" cy="137" r="5" fill="#A88BFF"/>
<text class="name" x="256" y="143">RULES</text>
<text class="sub" x="242" y="165">Routing lists</text>
