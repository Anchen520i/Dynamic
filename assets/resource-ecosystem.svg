<rect class="card" x="794" y="114" width="132" height="66" rx="13"/>
<circle class="dot" cx="813" cy="137" r="5" fill="#F07FA6"/>
<text class="name" x="826" y="143">MCP</text>
<text class="sub" x="812" y="165">Diagnostics</text>
