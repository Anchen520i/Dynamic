<rect class="card" x="414" y="114" width="170" height="66" rx="13"/>
<circle class="dot" cx="433" cy="137" r="5" fill="#3DE0C0"/>
<text class="name" x="446" y="143">MODULES</text>
<text class="sub" x="432" y="165">Surge extensions</text>
<rect class="halo" x="602" y="112" width="174" height="70" rx="15" fill="none" stroke="#F2B86B" stroke-width="3" filter="url(#glow)"/>
<rect class="card" x="604" y="114" width="170" height="66" rx="13"/>
<circle class="dot" cx="623" cy="137" r="5" fill="#F2B86B"/>
<text class="name" x="636" y="143">SCRIPTS</text>
