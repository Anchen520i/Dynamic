<rect class="card" x="395" y="253" width="170" height="66" rx="13"/>
<circle class="dot" cx="414" cy="276" r="5" fill="#73D0EA"/>
<text class="name" x="427" y="282">VISUALS</text>
<text class="sub" x="413" y="304">Icons · SVG</text>
<text x="34" y="365" fill="#7086AB" font-size="11">MYSTIC  /  STATIC FALLBACK · CSS MOTION · NO JAVASCRIPT</text></svg>